<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New issue · Burton Issues</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #000;
      color: #f5f2ec;
    }
    main { max-width: 28rem; padding: 2rem; text-align: center; }
    p { color: #9a958c; line-height: 1.45; }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
      background: #f5f2ec;
      color: #000;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>New issue</h1>
    <p id="status">Opening Burton Issues…</p>
    <p><a id="open" href="burtonissues://new">Open Burton Issues</a></p>
  </main>
  <script>
    (function () {
      var params = window.location.search.replace(/^\?/, "");
      var target = "burtonissues://new";
      if (params) target += "?" + params;
      document.getElementById("open").setAttribute("href", target);
      var intent = "intent://new";
      if (params) intent += "?" + params;
      intent += "#Intent;scheme=burtonissues;end";
      window.location.replace(intent);
      setTimeout(function () { window.location.replace(target); }, 400);
    })();
  </script>
</body>
</html>
